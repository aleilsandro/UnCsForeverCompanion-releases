name: Release AddOn and Pulser

on:
  push:
    tags:
      - '[0-9]*'

concurrency:
  group: pulser-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pulser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source snapshot
        shell: pwsh
        run: Expand-Archive -LiteralPath project-source.zip -DestinationPath . -Force
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
      - name: Build Windows installer
        shell: pwsh
        run: ./installer/build-web-bridge.ps1 -Version $env:GITHUB_REF_NAME
      - name: Verify and publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./distribution/publish-pulser.ps1 -Version $env:GITHUB_REF_NAME
